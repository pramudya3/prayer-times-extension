name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ZIP extension
        run: |
          zip -r prayer-times-extension-${{ github.ref_name }}.zip . -x "*.git*" ".github*" ".gitignore" ".DS_Store" "prayer-times-extension-*.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: prayer-times-extension-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
